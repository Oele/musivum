# Written for musivum: a configuration that writes its values in the less common ways YAML
# has, to hold the reading of it against LiveKit's (go-edge.txt is what LiveKit holds for it).

port: 0x1EA0 # a number in hexadecimal
development: yes # what YAML 1.1 takes for true
region: 12345 # a number where a string is wanted is its text
key_file: ~ # a null leaves a string as it is
log_level: !!str 5
bind_addresses: [127.0.0.1, "::1"]
enable_data_tracks: False
keys:
  key1: 0123456789
  key2: true
  "key 3": 'it''s'
  4: null
rtc:
  tcp_port: 7_881
  port_range_start: 50000.0
  port_range_end: 0o165140
  udp_port: " 7882 - 7892 "
  node_ip: 192.0.2.7, 2001:db8::7
  use_external_ip: off
  stun_servers: ~
  packet_buffer_size: +600
  packet_buffer_size_video: 1e3
  packet_buffer_size_audio: 0755
  allow_tcp_fallback: ~
  reconnect_on_publication_error: n
  reconnect_on_subscription_error: True
  reconnect_on_data_channel_error: "yes"
  data_channel_max_buffered_amount: 18446744073709551615
  datachannel_slow_threshold: -0x10
  datachannel_lossy_target_latency: 1h2m3.5s
  tcp_fallback_rtt_threshold: 12.9
  pli_throttle:
    low_quality: 250ms
    mid_quality: "1.5s"
  rtx_budget:
    audio:
      max_ratio: 1
  congestion_control:
    stream_allocator:
      probe_mode: media
      paused_min_wait: -1s
      disable_etimation_unmanaged_tracks: true
    remote_bwe:
      nack_ratio_attenuator: 1
      probe_controller:
        settle_wait_num_rtt: 7
        probe_regulator:
          backoff_factor: .5
    send_side_bwe:
      congestion_detector:
        estimaton_window_duration: 2s
        packet_group:
          min_packets: 12
        congested_ctr_trend:
          required_samples: 0x10
  turn_servers:
    - host: a.example.com
      port: 3478
      ttl: 90000
    - {host: b.example.com, protocol: tls, secret: s3}
    - &ts
      host: &name c.example.com
      username: u
      credential: c
    - <<: *ts
      port: 5349
      username: other
    - host: *name
      ttl: !!int "60"
video:
  dynacast_pause_delay: 0s
  stream_tracker_manager:
    video:
      stream_tracker_type: frame
      bitrate_report_interval:
        1: 2s
      packet_tracker:
        0:
          samples_required: 9
        3:
          cycle_duration: 1s
      frame_tracker: ~
    screenshare:
      packet_tracker: {}
room:
  auto_create: false
  enabled_codecs:
    - mime: video/h264
      fmtp_line: level-asymmetry-allowed=1;packetization-mode=1;profile-level-id=42e01f
    - ~
    - mime: audio/opus
  max_participants: 0b101
  empty_timeout: !!int "42"
  departure_timeout: !!float 30
  playout_delay: {enabled: on, min: 100, max: 2_000}
  max_metadata_size: 1000
  max_room_name_length: 0
  room_configurations:
    default:
      empty_timeout: 10
limit:
  bytes_per_sec: .5e9
  subscribe_pace_shadow_rates: [1, 2.5, 1e2]
  num_tracks: -1
  signal_message_size_limit: 0
logging:
  level: warn
  component_levels:
    foo: debug
  pion_level: ""
audio:
  active_level: 20
  smooth_intervals: 0
  active_red_encoding: Y
turn:
  relay_range_start: 40000
  ttl_seconds: 100000
  domain: |
    turn.example.com
  cert_file: >-
    /etc/musivum/
    cert.pem
  deny_peer_cidrs:
webhook:
  api_key:
  urls:
    - https://example.com/hook
  url_notifier:
    num_workers: 3
  resource_url_notifier:
    max_age: 1m
api:
  execution_timeout: 500ms
metric:
  timestamper_config:
    one_way_delay_estimator_max_batch: 5
prometheus_port: 0x2329
prometheus:
  port: 9_100
  username: 1234
  password: ~
