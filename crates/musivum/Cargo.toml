[package]
name = "musivum"
description = "A media server for calls that speaks LiveKit's protocol: a port of LiveKit's selective forwarding unit to Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Nothing to publish yet.
publish = false

[lints]
workspace = true

[dependencies]
base64 = "0.22.1"
bytes = "1.12.1"
hmac = "0.13.0"
musivum-protocol = { version = "0.0.0", path = "../musivum-protocol" }
parking_lot = "0.13.0"
pbjson-types = "0.9"
rand = "0.10.3"
rtc-rtcp = "0.21"
saphyr-parser = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
tokio-util = "0.7.20"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util", "rt-multi-thread", "macros"] }
tracing-subscriber = "0.3.23"
