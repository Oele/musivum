[workspace]
resolver = "3"
members = ["crates/musivum", "crates/musivum-protocol"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Oele/musivum"
authors = ["The musivum authors"]

[workspace.lints.rust]
unsafe_code = "forbid"

# rtc's RTP packet with one field more, the padding size that pion's has: see
# docs/webrtc-library.md and third_party/rtc-rtp/MUSIVUM.md.
[patch.crates-io]
rtc-rtp = { path = "third_party/rtc-rtp" }
